global:
  scrape_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: loki
    static_configs:
      - targets: ['loki-local:3100']

  - job_name: organicnow-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['organicnow-backend-local:8080']

  - job_name: promtail
    static_configs:
      - targets: ['promtail-local:9080']