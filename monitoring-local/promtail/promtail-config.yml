server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml   # ← ให้ตรงกับ volume /positions

clients:
  - url: http://loki-local:3100/loki/api/v1/push

scrape_configs:
  - job_name: organicnow-backend
    static_configs:
      - targets: [localhost]
        labels:
          job: organicnow-backend
          __path__: /logs/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<ts>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?P<level>DEBUG|INFO|WARN|ERROR)\b (?P<rest>.*)$'
      - timestamp:
          source: ts
          format: '2006-01-02 15:04:05'
      - labels:
          level   # ← ให้โปรมเทลยกค่าที่จับได้มาเป็น label จริง